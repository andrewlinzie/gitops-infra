apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-drift-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-drift-exporter
  template:
    metadata:
      labels:
        app: model-drift-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9100"
    spec:
      serviceAccountName: model-drift
      containers:
        - name: model-drift-exporter
          # Same tag as the CronJob and the dev inference Deployment. Contains src/jobs/drift.py --serve.
          image: 899631475351.dkr.ecr.us-east-2.amazonaws.com/ai-inference-service:c881928ea4c07c11f0f4b8c586805a93e881fa79
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.jobs.drift"]
          args: ["--serve", "9100"]
          ports:
            - name: metrics
              containerPort: 9100
          env:
            - name: BUCKET
              value: ai-cloud-platform-899631475351-dvc
            - name: AWS_REGION
              value: us-east-2
            - name: MODEL_VERSION
              value: drift-fixture
            - name: PROFILE_KEY
              value: monitoring/reference/drift-fixture/profile.json
            - name: PREDICTION_PREFIX
              value: monitoring/predictions
            - name: REPORT_PREFIX
              value: monitoring/reports
            - name: MIN_SAMPLES
              value: "100"
            - name: WINDOW_HOURS
              value: "24"
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
