                    "type": "prometheus",
                    "uid": "Prometheus"
                  },
                  "expr": "model_feature_psi",
                  "legendFormat": "{{model_version}} / {{feature}}",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "fillOpacity": 10,
                    "showPoints": "auto",
                    "spanNulls": false,
                    "thresholdsStyle": {
                      "mode": "line"
                    }
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "red",
                        "value": 0.25
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
