replicaCount: 1

image:
  repository: ai-inference-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001

metrics:
  enabled: "true"
  path: "/metrics"
  port: "8001"

serviceAccount:
  create: false
  name: ""
  annotations: {}

env:
  LOG_LEVEL: "info"
  MODEL_NAME: "stub-model"
  AWS_REGION: "us-east-2"
  PREDICTION_LOG_BUCKET: ""
  PREDICTION_LOG_PREFIX: "monitoring/predictions"
  PREDICTION_LOG_SAMPLE_RATE: "1"

# Readable record beside image.tag. CI fills the environment files. The pod does not read these.
model:
  version: ""
  registryVersion: ""
  runId: ""

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  path: /live
  initialDelaySeconds: 10
  periodSeconds: 15

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  memory:
    averageUtilization: 70
