fullnameOverride: mlflow

replicaCount: 1

telemetry:
  enabled: false

service:
  type: ClusterIP

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/security-groups: sg-0e423234ad0ce785a
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: "200"
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

# No domain yet. The ALB DNS name is the Host header, and it does not exist until the balancer does.
# A single "*" is the chart's override for that. The security group is the network gate.
serverAllowedHosts:
  - "*"

corsAllowedOrigins:
  - "*"

serviceAccount:
  create: true
  name: mlflow
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::899631475351:role/ai-cloud-platform-dev-mlflow

backendStore:
  databaseMigration: true
  databaseConnectionCheck: true
  postgres:
    enabled: true
    host: ai-cloud-platform-dev-mlflow.c1egy0ak63vw.us-east-2.rds.amazonaws.com
    port: 5432
    database: mlflow
    driver: psycopg2
  existingDatabaseSecret:
    name: mlflow-db
    usernameKey: username
    passwordKey: password

artifactRoot:
  # The laptop sends files to the tracking server. The pod role writes s3://…/mlflow/.
  proxiedArtifactStorage: true
  s3:
    enabled: true
    bucket: ai-cloud-platform-899631475351-dvc
    path: mlflow

auth:
  enabled: true
  sqliteFullPath: /tmp/
  existingAdminSecret:
    name: mlflow-admin
    usernameKey: username
    passwordKey: password
  postgres:
    enabled: false

postgresql:
  enabled: false

extraArgs:
  workers: "1"

resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
