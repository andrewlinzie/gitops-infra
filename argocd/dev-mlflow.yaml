apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-mlflow
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://community-charts.github.io/helm-charts
      chart: mlflow
      targetRevision: 1.11.7
      helm:
        valueFiles:
          - $values/dev/mlflow/values.yaml
    - repoURL: https://github.com/andrewlinzie/gitops-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
