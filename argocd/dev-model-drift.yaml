apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-model-drift
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/andrewlinzie/gitops-infra.git
    targetRevision: main
    path: model-drift
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
