apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: 3.6.2
      helm:
        valueFiles:
          - $values/dev/aws-load-balancer-controller/values.yaml
    - repoURL: https://github.com/andrewlinzie/gitops-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
